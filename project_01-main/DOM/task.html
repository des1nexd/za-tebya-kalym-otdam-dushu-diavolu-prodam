<main>
  <h1>Решение алгоритмической задачи</h1>

  <div class="task-card">
    <p>
      <b>Условие:</b> определить значение функции
      <span class="formula">Z = 1 / (X · Y)</span>
      при произвольных значениях <b>X</b> и <b>Y</b>.
    </p>

    <div class="inputs">
      <div>
        <label for="x">Значение X:</label>
        <input id="x" type="number" step="any" placeholder="например, 4">
      </div>

      <div>
        <label for="y">Значение Y:</label>
        <input id="y" type="number" step="any" placeholder="например, 2.5">
      </div>
    </div>

    <div class="buttons">
      <button class="btn-solve" id="solveBtn">Вычислить Z</button>
      <button class="btn-reset" id="resetBtn" type="reset">Сбросить</button>
    </div>

    <div id="result" class="result"></div>
  </div>
</main>

<script src="task.js"></script>
